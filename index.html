<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bobby – Técnico de Segurança do Trabalho</title>
<style>
  :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --accent: #f59e0b; --green: #10b981; --red: #ef4444; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; touch-action: none; }
  .game-container { position: relative; width: 100%; max-width: 800px; aspect-ratio: 16/9; background: #000; border: 4px solid #334155; border-radius: 12px; box-shadow: 0 20px 25px -5px rgb(0 0 / 0.5); overflow: hidden; }
  canvas { width: 100%; height: 100%; display: block; }
  
  /* UI / Menus */
  #ui { position: absolute; inset: 0; background: rgba(15, 23, 42, 0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; z-index: 10; }
  h1 { color: var(--accent); margin: 0 0 10px 0; font-size: 2rem; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
  p { margin: 8px 0; color: #94a3b8; font-size: 1rem; max-width: 500px; }
  input { padding: 12px; border-radius: 8px; border: 2px solid #475569; background: #0f172a; color: #fff; font-size: 1rem; text-align: center; width: 80%; max-width: 300px; margin: 10px 0; }
  button { background: linear-gradient(135deg, #f59e0b, #d97706); color: #000; border: none; border-radius: 8px; padding: 12px 24px; font-size: 1rem; font-weight: bold; cursor: pointer; margin: 6px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: transform 0.1s; width: 80%; max-width: 300px; }
  button:active { transform: scale(0.96); }
  button.secondary { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: #fff; }
  button.green { background: linear-gradient(135deg, #10b981, #047857); color: #fff; }

  /* Controles Mobile */
  #controls { display: none; width: 100%; max-width: 800px; justify-content: space-between; padding: 10px; margin-top: 10px; box-sizing: border-box; }
  .ctrl-group { display: flex; gap: 10px; }
  .ctrl-btn { width: 60px; height: 60px; background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; color: #fff; font-size: 1.5rem; display: flex; align-items: center; align-items: center; justify-content: center; user-select: none; }
  @media (pointer: coarse) { #controls { display: flex; } }
</style>
</head>
<body>

<div class="game-container">
  <canvas id="canvas" width="800" height="450"></canvas>
  <div id="ui">
    <h1>🦺 BOBBY: Técnico de Segurança</h1>
    <p>Gerencie os riscos da fábrica, responda questões de dados e segurança do trabalho (NRs e EPIs) e venve o desafio!</p>
    <input id="playerName" type="text" placeholder="Seu Nome" maxlength="15" value="Bobby">
    <button onclick="startGame()">▶ Iniciar Jogo</button>
    <button class="secondary" onclick="openRoom()">🏫 Sala (Multijogador)</button>
    <button class="green" onclick="openRanking()">🏆 Ranking Local</button>
  </div>
</div>

<div id="controls">
  <div class="ctrl-group">
    <div class="ctrl-btn" id="btnLeft">◀</div>
    <div class="ctrl-btn" id="btnRight">▶</div>
  </div>
  <div class="ctrl-group">
    <div class="ctrl-btn" id="btnAction">⚡</div>
    <div class="ctrl-btn" id="btnJump">▲</div>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const ui = document.getElementById('ui');

// Estados do Jogo
let gameState = 'MENU'; // MENU, PLAYING, QUESTION, GAMEOVER, VICTORY, ROOM, RANKING
let score = 0, lives = 5, level = 1;
let playerName = 'Bobby';

// Jogador
let player = { x: 50, y: 300, w: 30, h: 48, vx: 0, vy: 0, speed: 4, jumpForce: -11, grounded: false, facing: 1 };
let keys = { left: false, right: false, jump: false, action: false };

// Elementos da Fase
let platforms = [];
let hazards = [];
let workers = [];
let currentQuestion = null;
let activeQuestionWorker = null;

// Banco de Perguntas de Segurança e Dados (Baseado no projeto original)
const questionsPool = [
  { q: "Funcionário na marcenaria sem proteção para os olhos. Dados: 62% das lesões oculares ocorreram sem óculos. Qual EPI correto?", options: ["Luvas de couro", "Óculos de proteção", "Capacete"], correct: 1, tip: "Partículas voam nos olhos; óculos evitam a lesão." },
  { q: "Operador de esmerilhadeira exposto a 95 dB. O que fornecer?", options: ["Protetor auricular", "Máscara PFF2", "Botina"], correct: 0, tip: "Acima de 85 dB exige proteção auditiva obrigatória." },
  { q: "A partir de qual altura o trabalho é considerado 'em altura' pela NR-35?", options: ["1,0 metro", "2,0 metros", "5,0 metros"], correct: 1, tip: "NR-35 define trabalho em altura acima de 2 metros." },
  { q: "Extintor adequado para incêndio em equipamentos elétricos energizados (Classe C)?", options: ["Água", "Pó Químico ou CO2", "Areia molhada"], correct: 1, tip: "Água conduz eletricidade e agrava o risco." },
  { q: "O que significa a sigla EPI na Segurança do Trabalho?", options: ["Equipamento de Proteção Individual", "Estudo Padrão Industrial", "Escala de Prevenção Interna"], correct: 0, tip: "Protege a saúde e integridade física do trabalhador." },
  { q: "Em um setor com 50 funcionários, 3 estavam sem óculos de proteção. Qual a % irregular?", options: ["3%", "6%", "15%"], correct: 1, tip: "3 ÷ 50 = 0,06 = 6% de irregularidade." }
];

// Multiplayer via BroadcastChannel & LocalStorage (Sem servidor externo, roda perfeito no SENAI)
const clientId = Math.random().toString(36.substring(2, 9));
let remotePlayers = {};
const bc = window.BroadcastChannel ? new BroadcastChannel('bobby_senai_room') : null;
if (bc) {
  bc.onmessage = (e) => {
    if (e.data && e.data.id !== clientId) {
      remotePlayers[e.data.id] = e.data;
    }
  };
}
window.addEventListener('storage', (e) => {
  if (e.key === 'bobby_sync_data' && e.newValue) {
    try {
      let data = JSON.parse(e.newValue);
      if (data.id !== clientId) remotePlayers[data.id] = data;
    } catch(err){}
  }
});

setInterval(() => {
  if (gameState === 'PLAYING') {
    let payload = { id: clientId, name: playerName, x: player.x, y: player.y, level: level, score: score, time: Date.now() };
    if (bc) bc.postMessage(payload);
    try { localStorage.setItem('bobby_sync_data', JSON.stringify(payload)); } catch(err){}
  }
}, 100);

// Controles
window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
  if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') {
    if (gameState === 'PLAYING' && player.grounded) { player.vy = player.jumpForce; player.grounded = false; }
  }
});
window.addEventListener('keyup', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
});

// Touch controls mobile
document.getElementById('btnLeft').ontouchstart = () => keys.left = true;
document.getElementById('btnLeft').ontouchend = () => keys.left = false;
document.getElementById('btnRight').ontouchstart = () => keys.right = true;
document.getElementById('btnRight').ontouchend = () => keys.right = false;
document.getElementById('btnJump').ontouchstart = () => { if (player.grounded) { player.vy = player.jumpForce; player.grounded = false; } };

function startGame() {
  const nameInput = document.getElementById('playerName').value.trim();
  if (nameInput) playerName = nameInput;
  score = 0; lives = 5; level = 1;
  loadLevel(level);
  ui.style.display = 'none';
  gameState = 'PLAYING';
}

function loadLevel(lvl) {
  player.x = 50; player.y = 300; player.vx = 0; player.vy = 0;
  platforms = [
    { x: 0, y: 380, w: 1200, h: 70, type: 'floor' },
    { x: 300, y: 280, w: 150, h: 20, type: 'plat' },
    { x: 550, y: 200, w: 180, h: 20, type: 'plat' },
    { x: 800, y: 280, w: 150, h: 20, type: 'plat' }
  ];
  hazards = [
    { x: 400, y: 350, w: 30, h: 30, type: 'fire' },
    { x: 700, y: 350, w: 30, h: 30, type: 'hazard' }
  ];
  workers = [
    { x: 600, y: 340, w: 30, h: 40, resolved: false, q: questionsPool[(lvl - 1) % questionsPool.length] }
  ];
}

function openRoom() {
  ui.innerHTML = `
    <h1>🏫 Sala Multijogador</h1>
    <p>Colegas conectados na mesma rede ou abas:</p>
    <div id="roomList" style="background:#0f172a; padding:10px; border-radius:8px; width:80%; max-height:150px; overflow-y:auto; margin: 10px 0;">Carregando...</div>
    <button onclick="location.reload()">Voltar</button>
  `;
  setInterval(() => {
    let listHTML = `<div><b>Você:</b> ${playerName} (Fase ${level})</div>`;
    let now = Date.now();
    for (let id in remotePlayers) {
      let p = remotePlayers[id];
      if (now - p.time < 4000) {
        listHTML += `<div><b>${p.name}</b> — Fase ${p.level} (${p.score} pts)</div>`;
      }
    }
    document.getElementById('roomList').innerHTML = listHTML;
  }, 1000);
}

function openRanking() {
  let rank = JSON.parse(localStorage.getItem('bobby_ranking') || '[]');
  let html = `<h1>🏆 Ranking</h1>`;
  if (rank.length === 0) html += `<p>Nenhum recorde salvo ainda.</p>`;
  else {
    rank.forEach((r, i) => { html += `<p>${i+1}º ${r.name} — ${r.score} pts (Fase ${r.level})</p>`; });
  }
  html += `<button onclick="location.reload()">Voltar</button>`;
  ui.innerHTML = html;
}

function saveRanking() {
  let rank = JSON.parse(localStorage.getItem('bobby_ranking') || '[]');
  rank.push({ name: playerName, score: score, level: level });
  rank.sort((a,b) => b.score - a.score);
  localStorage.setItem('bobby_ranking', JSON.stringify(rank.slice(0, 5)));
}

// Loop Principal do Jogo
function update() {
  if (gameState !== 'PLAYING') return;

  // Movimento
  player.vx = 0;
  if (keys.left) { player.vx = -player.speed; player.facing = -1; }
  if (keys.right) { player.vx = player.speed; player.facing = 1; }

  player.vy += 0.5; // Gravidade
  player.x += player.vx;
  player.y += player.vy;

  // Colisão com plataformas
  player.grounded = false;
  platforms.forEach(p => {
    if (player.x < p.x + p.w && player.x + player.w > p.x &&
        player.y + player.h > p.y && player.y + player.h < p.y + p.vy + 10 && player.vy >= 0) {
      player.y = p.y - player.h;
      player.vy = 0;
      player.grounded = true;
    }
  });

  if (player.y > 450) {
    lives--;
    if (lives <= 0) {
      gameState = 'GAMEOVER';
      saveRanking();
      ui.innerHTML = `<h1>❌ Demitido!</h1><p>Você perdeu todas as vidas por falhas de segurança.</p><button onclick="location.reload()">Tentar Novamente</button>`;
      ui.style.display = 'flex';
    } else {
      player.x = 50; player.y = 200; player.vy = 0;
    }
  }

  // Interação com Trabalhadores (Perguntas)
  workers.forEach(w => {
    if (!w.resolved && Math.abs(player.x - w.x) < 30 && Math.abs(player.y - w.y) < 40) {
      gameState = 'QUESTION';
      activeQuestionWorker = w;
      currentQuestion = w.q;
      showQuestionUI();
    }
  });
}

function showQuestionUI() {
  let q = currentQuestion;
  ui.innerHTML = `
    <h3>⚠️ Questão de Segurança</h3>
    <p style="font-size: 0.95rem; font-weight: bold; color: #f59e0b;">${q.q}</p>
    ${q.options.map((opt, idx) => `<button onclick="answerQuestion(${idx})">${String.fromCharCode(65+idx)}. ${opt}</button>`).join('')}
  `;
  ui.style.display = 'flex';
}

function answerQuestion(idx) {
  if (idx === currentQuestion.correct) {
    score += 100;
    activeQuestionWorker.resolved = true;
    ui.innerHTML = `<h1>✅ Acertou!</h1><p>${currentQuestion.tip}</p><button onclick="resumeGame()">Continuar</button>`;
  } else {
    lives--;
    ui.innerHTML = `<h1>❌ Errou!</h1><p>−1 Vida. ${currentQuestion.tip}</p><button onclick="resumeGame()">Continuar</button>`;
  }
}

function resumeGame() {
  ui.style.display = 'none';
  if (lives <= 0) {
    gameState = 'GAMEOVER';
    ui.innerHTML = `<h1>❌ Demitido!</h1><button onclick="location.reload()">Reiniciar</button>`;
    ui.style.display = 'flex';
  } else {
    gameState = 'PLAYING';
    // Verificar se completou os trabalhadores para avançar de fase
    if (workers.every(w => w.resolved)) {
      if (level < 3) {
        level++;
        loadLevel(level);
      } else {
        gameState = 'VICTORY';
        saveRanking();
        ui.innerHTML = `<h1>🏆 Vitória!</h1><p>Você garantiu a segurança da fábrica e venceu com ${score} pontos!</p><button onclick="location.reload()">Jogar de Novo</button>`;
        ui.style.display = 'flex';
      }
    }
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Fundo da Fábrica
  ctx.fillStyle = '#1e293b';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Plataformas
  platforms.forEach(p => {
    ctx.fillStyle = p.type === 'floor' ? '#334155' : '#475569';
    ctx.fillRect(p.x, p.y, p.w, p.h);
  });

  // Trabalhadores
  workers.forEach(w => {
    ctx.fillStyle = w.resolved ? '#10b981' : '#f59e0b';
    ctx.fillRect(w.x, w.y, w.w, w.h);
    ctx.fillStyle = '#fff';
    ctx.font = '16px sans-serif';
    ctx.fillText(w.resolved ? '✅' : '👷 ❗', w.x - 2, w.y - 8);
  });

  // Jogador (Bobby)
  ctx.fillStyle = '#3b82f6';
  ctx.fillRect(player.x, player.y, player.w, player.h);
  // Prancheta característica do Bobby
  ctx.fillStyle = '#f59e0b';
  ctx.fillRect(player.facing > 0 ? player.x + player.w - 6 : player.x, player.y + 15, 6, 12);

  // Outros jogadores em multiplayer
  let now = Date.now();
  for (let id in remotePlayers) {
    let p = remotePlayers[id];
    if (now - p.time < 4000 && p.level === level) {
      ctx.fillStyle = '#a855f7';
      ctx.fillRect(p.x, p.y, player.w, player.h);
      ctx.fillStyle = '#fff';
      ctx.font = '10px sans-serif';
      ctx.fillText(p.name, p.x - 5, p.y - 6);
    }
  }

  // HUD / Placar Superior
  ctx.fillStyle = 'rgba(15, 23, 42, 0.8)';
  ctx.fillRect(0, 0, canvas.width, 40);
  ctx.fillStyle = '#f8fafc';
  ctx.font = 'bold 14px system-ui';
  ctx.fillText(`👷 ${playerName} | Fase ${level} | ⭐ ${score} pts | Vidas: ${'❤️ '.repeat(lives)}`, 15, 25);
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// Iniciar loop de animação imediatamente para evitar tela preta
requestAnimationFrame(loop);
</script>
</body>
</html>
