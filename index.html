<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bobby – Técnico de Segurança</title>
<style>
:root{--bg:#e8ecf4;--fg:#111827;--card:#fff;--ac:#ff8a00;--bd:#c7cfdd}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#10131c;--fg:#f3f4f6;--card:#1d2333;--bd:#33405c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,Segoe UI,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;padding:8px}
.wrap{position:relative;width:100%;max-width:800px}
canvas{width:100%;display:block;border-radius:10px;border:2px solid var(--bd);background:#000;touch-action:none}
#o{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:14px;background:radial-gradient(circle at 50% 25%,rgba(45,60,110,.96),rgba(8,10,18,.98));color:#f3f4f6;text-align:center;border-radius:10px;overflow:auto;z-index:20}
#o h3{margin:0;font-size:1.4rem;color:#ffb300}
#o p{margin:4px 0;max-width:560px}
.s{opacity:.8;font-size:.9rem}
#o button{background:linear-gradient(#ffb300,#ff7a00);color:#111;border:0;border-radius:12px;padding:12px 18px;font-size:1rem;font-weight:800;cursor:pointer;max-width:560px;width:100%;box-shadow:0 4px 0 #a34f00}
#o button:active{transform:translateY(2px)}
#o .opt{text-align:left;color:#fff;display:flex;gap:10px;align-items:center}
#o .opt b{background:#0004;border-radius:8px;padding:2px 10px}
#o .o0{background:linear-gradient(#38bdf8,#0369a1)}
#o .o1{background:linear-gradient(#c084fc,#7e22ce)}
#o .o2{background:linear-gradient(#4ade80,#15803d)}
.card{background:linear-gradient(#232c4d,#171d36);border:2px solid #5b72c0;border-radius:18px;padding:18px;width:min(620px,100%);display:flex;flex-direction:column;gap:10px;box-shadow:0 12px 40px #000b}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.st{flex:1;min-width:90px;border-radius:12px;padding:8px;font-weight:700;color:#fff}
.st span{display:block;font-size:1.5rem}
.bar{width:min(380px,90%);height:16px;background:#444;border-radius:8px;overflow:hidden;margin:0 auto}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#f43f5e,#facc15,#4ade80)}
.letter{background:#fffbe6;color:#222;padding:14px;border-radius:6px;max-width:460px;font-family:Georgia,serif;text-align:left}
#t{display:none;gap:8px;margin-top:8px;width:100%;max-width:800px;justify-content:space-between}
#t button{flex:1;font-size:1.5rem;padding:12px;border-radius:12px;border:2px solid var(--bd);background:var(--card);color:var(--fg);user-select:none;touch-action:none}
@media (pointer:coarse){#t{display:flex}}
small{margin-top:6px;opacity:.75}
#pz{position:absolute;right:8px;top:8px;width:40px;height:40px;border-radius:10px;border:2px solid #5b72c0;background:#16213bdd;color:#fff;font-size:1.1rem;cursor:pointer;z-index:25}
#o input{padding:10px;border-radius:10px;border:2px solid #5b72c0;background:#0f172a;color:#fff;font-size:1rem;text-align:center;width:100%}
.k{display:inline-block;background:#e2e8f0;color:#111;border-radius:6px;padding:0 6px;font-weight:800}
</style>
</head>
<body>
<div class="wrap">
  <canvas id="c" width="800" height="450"></canvas>
  <button id="pz" title="Pausar">⏸</button>
  <div id="o"><h3>Carregando jogo...</h3></div>
</div>
<div id="t">
  <button id="bl">◀</button>
  <button id="br">▶</button>
  <button id="bj">⤒</button>
  <button id="bx">🧯</button>
  <button id="bc">💥</button>
</div>
<small>Setas/A-D: andar • Espaço/W/↑: pular • X: espuma 🧯 • C: onda de choque 💥 • Responda com A/B/C ou 1/2/3</small>

<script>
const C = document.getElementById('c'), g = C.getContext('2d'), W = 800, H = 450, GY = 380;
const $= id => document.getElementById(id), O =$('o');
const show = h => { O.innerHTML = '<div class="card">' + h + '</div>'; keys.l = keys.r = keys.j = keys.x = keys.c = 0; O.style.display = 'flex'; };
const hide = () => { O.style.display = 'none'; };

const Q = [[
  'Funcionário na marcenaria sem proteção para os olhos. Dados: 62% das lesões oculares ocorreram sem óculos. Qual EPI?|Luvas de couro|Óculos de proteção|Capacete|1|Partículas voam nos olhos; óculos evitam a lesão.',
  'Operador de esmerilhadeira exposto a 95 dB. O que fornecer?|Protetor auricular|Máscara PFF2|Botina|0|Acima de 85 dB exige proteção auditiva.',
  'Funcionário carrega peças pesadas de chinelo. EPI correto?|Meia grossa|Tênis comum|Botina com biqueira|2|A biqueira protege contra queda de objetos.',
  'Quem deve fornecer o EPI, sem custo, ao trabalhador?|O funcionário|A empresa|O sindicato|1|A NR-6 obriga o empregador a fornecer gratuitamente.'],[
  'A partir de qual altura o trabalho é considerado "em altura" (NR-35)?|1,0 m|2,0 m|5,0 m|1|NR-35: acima de 2 metros do nível inferior.',
  'Pintor trabalhando a 6 m sem proteção. Qual EPI essencial?|Luvas|Capacete apenas|Cinto paraquedista com trava-quedas|2|Previne a queda e limita o impacto.',
  'Dados: 40% das quedas ocorreram sem linha de vida. Prioridade?|Instalar linha de vida|Comprar mais escadas|Reduzir pausas|0|Ataque a causa mais frequente.',
  'Antes de subir no andaime, o técnico deve:|Subir rápido|Não olhar para baixo|Emitir PT e inspecionar o andaime|2|Permissão de Trabalho e inspeção são obrigatórias.'],[
  'Extintor de água em equipamento elétrico energizado?|Pode, sem problemas|Não, risco de choque|Só com mangueira|1|Água conduz eletricidade.',
  'Extintor para incêndio em líquidos inflamáveis (classe B)?|Água|Pó químico ou CO₂|Areia molhada|1|Água espalha o líquido em chamas.',
  'Extintor sem lacre e manômetro no vermelho. O que fazer?|Deixar no lugar|Pintar o ponteiro|Retirar para recarga e substituir|2|Equipamento irregular não protege ninguém.',
  'Dados: 8 de 10 extintores estão vencidos. Qual % está irregular?|8%|80%|18%|1|8 ÷ 10 = 0,8 = 80%.'],[
  'Acima de qual nível de ruído (8 h) o controle é exigido?|85 dB|60 dB|120 dB|0|Limite de tolerância: 85 dB para 8 h.',
  'Manipulação de ácidos: qual luva?|Algodão|Nitrílica ou PVC (química)|Nenhuma|1|Luvas químicas resistem à corrosão.',
  'Poeira fina de cimento no ar. EPI respiratório?|Lenço|Óculos|Respirador PFF2|2|PFF2 filtra partículas finas.',
  'Acidentes: Solda 12, Pintura 20, Corte 8. Qual % é da Pintura?|20%|40%|50%|2|20 ÷ 40 = 50%.'],[
  'Acidente com afastamento: qual documento a empresa emite?|Nota fiscal|CAT – Comunicação de Acidente de Trabalho|Holerite|1|A CAT é obrigatória.',
  'CIPA significa:|Comissão Interna de Prevenção de Acidentes|Central de Inspeção Predial|Controle Interno de Pessoal|0|Atua na prevenção dentro da empresa.',
  'Na hierarquia de controle, o que vem ANTES do EPI?|Multa|Medidas coletivas (EPC)|Nada|1|Priorize eliminar o risco e usar EPC.',
  '5 acidentes em 100 funcionários. Qual a taxa?|5%|50%|0,5%|0|5 ÷ 100 = 5%.'],[
  'O que significa EPI?|Equipamento de Proteção Individual|Equipamento Padrão Industrial|Estudo de Prevenção Interna|0|Protege o trabalhador contra riscos.',
  'Qual norma regulamenta os EPIs?|NR-35|NR-6|NR-10|1|NR-6 trata dos EPIs.',
  'Cor da sinalização de equipamentos de combate a incêndio?|Verde|Azul|Vermelha|2|Vermelho = incêndio.',
  'Para que serve o mapa de riscos?|Identificar perigos e priorizar ações|Enfeitar o setor|Reduzir a equipe|0|Base para prevenir acidentes.',
  '3 de 50 funcionários estavam sem EPI. Qual %?|3%|6%|15%|1|3 ÷ 50 = 6%.']
];

const LV = [
  {n:'Fase 1 – Almoxarifado',ns:5,w:3,en:['🛢️','🐀'],ne:1,q:0},
  {n:'Fase 2 – Obra em Altura',ns:6,w:4,en:['🧱','🐀'],ne:1,q:1},
  {n:'Fase 3 – Setor de Incêndio',ns:6,w:5,en:['🔥','⚡'],ne:2,q:2},
  {n:'Fase 4 – Ruído e Químicos',ns:7,w:5,en:['☣️','💥'],ne:2,q:3},
  {n:'Fase 5 – CHEFÃO: Acidente Grave',ns:6,w:3,en:['🔥','☣️'],ne:1,q:4,boss:1}
];

let ext=0, wave=0, jt=0, cd=0, wt=0, pj=[], drs=[], inv=[], tm='', tt=0, pm=0, pn='Bobby', lv=0, lives=5, score=0, lvScore=0, hits=0, miss=0, shield=0, aura=0, streak=0, pause=1, dead=0, cam=0, p, solids, plats, coins, ens, wk, boss, flagX, keys={l:0,r:0,j:0};
const sh = a => a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);

function build(){
  const d = LV[lv], gp = 120 + lv * 20, keyAt = {}, nd = [1,2,2,3,2][lv];
  for(let k=0; k<nd; k++) keyAt[1+2*k] = (k+lv)%4;
  let s = 7 + lv; const r = () => (s = s * 16807 % 2147483647) / 2147483647;
  solids = []; plats = []; coins = []; ens = []; wk = []; boss = null; drs = []; inv = [];
  
  for(let i=0; i<d.ns; i++){
    const x = i * 710;
    solids.push([x, GY, i==d.ns-1?700:710-gp, 70]);
    if(i < d.ns-1){
      const gx = x + 710 - gp, gc = gx + gp/2;
      if((i+lv)%2){
        const m = [gc-45, GY-14, 90, 14]; m.m = [gc-45, gp/2-30, .035+lv*.008, i]; plats.push(m);
      } else {
        const n = Math.ceil(gp/40), w = gp/n;
        for(let k=0; k<n; k++){ const q = [gx+k*w, GY, w, 14]; q.br = 1; q.y0 = GY; q.t = 0; plats.push(q); }
      }
    }
    const px = x + 180 + r()*200;
    plats.push([px, 290, 110, 14]);
    const K = [['⛑️',0],['🧯','e'],['🥽',0],['💥','w'],['🧤',0],['🥾','j'],['💖','h']][(i+lv*2)%7];
    const kd = keyAt[i];
    coins.push(kd===undefined ? [px+55, 262, 0, K[0], K[1]] : [px+55, 262, 0, kd%2?'💳':'🔑', 'k'+kd]);
    for(let k=0; k<3; k++) coins.push([x+90+k*45, GY-50, 0, ['🥽','🧤','🦺','⛑️','🎧'][(i+k)%5], 0]);
    
    if(i>0) for(let j=0; j<d.ne+1; j++){
      const ex = x + (j%2?400:130) - (j>1?60:0);
      ens.push({x:ex, x0:ex, y:GY-30, vy:0, r:60+lv*8, v:1.6+lv*.45+j*.2, d:j%2?1:-1, e:d.en[j%2], dead:0, hop:lv>=1&&j%2==0, t:60*j});
    }
    if(i>0 && lv>=1) ens.push({x:x+250, x0:x+250, y:GY-120, by:GY-120, fl:1, r:140, v:1.8+lv*.3, d:1, e:'bat', dead:0, t:i*20, vy:0});
  }
  for(let k=0; k<nd; k++){
    const ds = 2+2*k; if(ds>=d.ns) break;
    const o = [ds*710+14, GY-260, 24, 260]; o.c = (k+lv)%4; o.o = 0; solids.push(o); drs.push(o);
  }
  const pool = Q[d.q];
  for(let i=1; i<=d.w; i++) wk.push({x:i*710+300, y:GY-40, done:0, q:pool[(i-1)%pool.length]});
  const L = (d.ns-1)*710; flagX = L + 540;
  if(d.boss) boss = {x:L+330, x0:L+330, y:GY-90, hp:3, inv:0, d:-1, qs:sh(Q[4])};
  p = {x:60, y:300, vx:0, vy:0, w:28, h:44, on:0, f:1, cx:60, inv:0};
}

function startLv(){ pm=0; hits=miss=lvScore=0; aura=0; streak=0; dead=0; build(); hide(); pause=0; }
function add(n){ score+=n; lvScore+=n; }
function loseLife(){ lives--; streak=0; p.inv=90; if(lives<=0) dismiss(); }
function hurt(){ if(p.inv>0||aura>0) return; if(shield){ shield=0; p.inv=60; return; } loseLife(); }

function ask(q, title, cb){
  pause = 1;
  const [t, a, b, c, k, w] = q.split('|'), o = [a, b, c];
  show(`<h3>${title}</h3><p style="font-weight:600">${t}</p><p class="s">❤️ ${Math.max(0,lives)} vidas</p>` + o.map((x,i)=>`<button class="opt o${i}" data-i="${i}"><b>${'ABC'[i]}</b> ${x}</button>`).join(''));
  O.querySelectorAll('button').forEach(bt => bt.onclick = () => {
    const ok = +bt.dataset.i == k;
    show(`<h3 style="color:${ok?'#4ade80':'#f87171'}">${ok?'✅ Acertou!':'❌ Errou! −1 vida ❤️'}</h3><p>Resposta: <b style="color:#fde047">${o[k]}</b></p><p class="s">💡 ${w}</p><button id="nx">Continuar</button>`);
    $('nx').onclick = () => { hide(); cb(ok); if(!dead && !O.innerHTML.includes('Fase')) pause=0; };
  });
}

function answer(ok){
  if(ok){ hits++; add(50*(aura>0?2:1)); if(++streak>=3){ aura=480; streak=0; } }
  else { miss++; loseLife(); }
}

function dismiss(){
  dead=1; pause=1; addLB();
  show(`<div class="letter"><b>CARTA DE DEMISSÃO</b><p>Prezado ${pn}, desligado por falhas de segurança. — RH</p></div><button id="nx">Arrumar emprego</button>`);
  $('nx').onclick = interview;
}

function interview(){
  let ok=0, i=0; const qs = sh(Q[5]).slice(0,3);
  (function next(){
    if(i==3){
      if(ok>=2){ lives=3; score=0; show(`<h3>🎉 Contratado!</h3><p>Voltou com 3 vidas.</p><button id="nx">Voltar</button>`); $('nx').onclick = startLv; }
      else { show(`<h3>Reprovado</h3><p>Acertos: ${ok}/3.</p><button id="nx">Tentar de novo</button>`); $('nx').onclick = interview; }
      return;
    }
    ask(qs[i], `Entrevista ${i+1}/3`, r => { ok+=r; i++; dead=1; next(); });
  })();
}

function endLv(){
  pause = 1; const t = hits+miss, acc = t ? Math.round(hits/t*100) : 100, ex = Math.floor(lvScore/150);
  lives += ex; if(acc>=80) shield = 1;
  const last = lv == LV.length-1; if(last) addLB();
  show(`<h3>${last?'🏆 VITÓRIA!':'✅ Fase concluída!'}</h3><div style="font-size:1.8rem">${'⭐'.repeat(acc>=90?3:acc>=60?2:1)}</div><div class="bar"><i style="width:${acc}%"></i></div><div class="stats"><div class="st" style="background:#166534">Acertos<span>${hits}</span></div><div class="st" style="background:#991b1b">Erros<span>${miss}</span></div><div class="st" style="background:#1e40af">Precisão<span>${acc}%</span></div></div><p>🎁 +${ex} vida(s)</p><button id="nx">${last?'Jogar de novo':'Próxima fase'}</button>`);
  $('nx').onclick = () => { if(last){ lv=0; lives=5; score=0; shield=0; } else lv++; startLv(); };
}

function ov(a,b,c,d,e,f,h,i){ return a<e+h && a+c>e && b<f+i && b+d>f; }

function upd(){
  if(pause) return;
  const a = keys.l?-1:keys.r?1:0; p.vx = a*(aura>0?5.5:4); if(a) p.f = a;
  if(keys.j && p.on){ p.vy = jt>0?-15.5:-12.5; p.on=0; }
  p.vy += .6; if(p.vy>14) p.vy=14; p.x += p.vx; if(p.x<0) p.x=0;
  for(const s of solids) if(ov(p.x,p.y,p.w,p.h,s[0],s[1],s[2],s[3]) && p.y+p.h>s[1]+6) p.x = p.vx>0?s[0]-p.w:s[0]+s[2];
  const pb = p.y+p.h; p.y += p.vy; p.on = 0; p.rd = 0;
  for(const s of solids.concat(plats)) if(p.vy>=0 && p.x+p.w>s[0] && p.x<s[0]+s[2] && pb<=s[1]+4 && p.y+p.h>=s[1]){
    p.y = s[1]-p.h; p.vy = 0; p.on = 1; p.rd = s;
    if(s[3]==70) p.cx = Math.max(60, Math.floor(p.x/710)*710+40);
  }
  if(p.y > H+60){ p.x = p.cx; p.y = 300; p.vy = 0; if(!(p.inv>0)) loseLife(); p.inv = 90; }
  if(p.inv>0) p.inv--; if(aura>0) aura--;
  
  for(const e of ens){
    if(e.dead) continue;
    if(Math.abs(p.x-e.x)<220 && Math.abs(p.y-e.y)<120) e.d = p.x>e.x?1:-1;
    e.x += e.v*e.d; if(e.x>e.x0+e.r){e.x=e.x0+e.r; e.d=-1;} if(e.x<e.x0-e.r){e.x=e.x0-e.r; e.d=1;}
    if(ov(p.x,p.y,p.w,p.h,e.x-14,e.y,28,30)){
      if(p.vy>0 && p.y+p.h-e.y<22){ e.dead=1; p.vy=-8; add(10); } else hurt();
    }
  }
  for(const c of coins) if(!c[2] && ov(p.x,p.y,p.w,p.h,c[0]-10,c[1]-10,20,20)){ c[2]=1; pick(c); }
  for(const w of wk) if(!w.done && !pause && ov(p.x,p.y,p.w,p.h,w.x-15,w.y,30,40)){
    ask(w.q, '⚠️ Segurança!', ok => { answer(ok); if(ok) w.done=1; else p.x-=70; }); break;
  }
  if(boss && boss.hp>0){
    boss.x += (2.2+(3-boss.hp)*.8)*boss.d; if(Math.abs(boss.x-boss.x0)>180) boss.d*=-1;
    if(boss.inv>0) boss.inv--;
    if(boss.inv<=0 && !pause && ov(p.x,p.y,p.w,p.h,boss.x-40,boss.y,80,90)){
      boss.inv = 150; ask(boss.qs[boss.hp-1%4], '🔥 CHEFÃO!', ok => { answer(ok); if(ok) boss.hp--; p.x-=90; });
    }
  }
  const open = wk.every(w=>w.done) && (!boss || boss.hp<=0);
  if(open && p.x > flagX-20) endLv();
  cam = Math.max(0, Math.min(p.x-300, (LV[lv].ns-1)*710+700-W));
}

function drawP(){
  if(p.inv>0 && p.inv%8<4 && !(aura>0)) return;
  g.save(); g.translate(
